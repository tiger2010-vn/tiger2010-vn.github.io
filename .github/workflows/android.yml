name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png www/

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: App icon, splash and colors
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          if command -v magick >/dev/null 2>&1; then CV="magick"; ID="magick identify"; else CV="convert"; ID="identify"; fi
          RES=android/app/src/main/res
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            $CV icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            $CV icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_round.png
          done
          for pair in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            d=${pair%%:*}; s=${pair##*:}
            $CV icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_foreground.png
          done
          sed -i 's|#FFFFFF|#05070D|' $RES/values/ic_launcher_background.xml
          sed -i 's|<item name="android:background">@null</item>|<item name="android:background">@null</item><item name="android:statusBarColor">#05070D</item><item name="android:navigationBarColor">#05070D</item>|' $RES/values/styles.xml
          for f in $(find $RES -name splash.png); do
            size=$($ID -format "%wx%h" "$f")
            $CV -size "$size" xc:'#05070d' \( icon-512.png -resize 256x256 \) -gravity center -composite "$f"
          done

      - name: Sync web files
        run: npx cap sync android

      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TigerIT.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TigerIT build ${{ github.run_number }}
          files: TigerIT.apk
